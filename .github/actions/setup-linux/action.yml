name: C++26 Linux tools
description: Install current GCC/libstdc++ and LLVM in the Arch Linux CI container
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        pacman -Syu --noconfirm --needed gcc clang clang-tools-extra compiler-rt cmake ninja git python codespell lcov doxygen graphviz
        g++ --version
        clang++ --version
        cmake --version
        clang-format --version
        clang-tidy --version
        # CMake probes capabilities and numeric behavior. Newer tool releases
        # must pass the same tests, not fail an exact version-string comparison.
