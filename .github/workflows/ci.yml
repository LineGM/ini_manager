name: Continuous Integration
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    strategy:
      fail-fast: false
      matrix:
        include:
          - preset: ci-ubuntu
            compiler: g++
          - preset: ci-clang
            compiler: clang++
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-linux
      - run: cmake --preset=${{ matrix.preset }} -DCMAKE_CXX_COMPILER=${{ matrix.compiler }} -DINI_MANAGER_BUILD_BENCHMARKS=ON
      - run: cmake --build --preset=${{ matrix.preset }} --parallel 2
      - run: ctest --preset=${{ matrix.preset }}
      - run: cmake --build --preset=${{ matrix.preset }} --target run-examples all_verify_interface_header_sets
      - name: Check formatting
        if: matrix.compiler == 'clang++'
        run: cmake -P cmake/lint.cmake
      - name: Check spelling
        if: matrix.compiler == 'clang++'
        run: cmake -P cmake/spell.cmake
      - name: Check clang-tidy
        if: matrix.compiler == 'clang++'
        run: cmake --build --preset=ci-clang --target tidy-check
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: |
          brew install gcc@16 ninja cmake
          echo "$(brew --prefix gcc@16)/bin" >> "$GITHUB_PATH"
      - run: cmake --preset=ci-macos
      - run: cmake --build --preset=ci-macos --parallel 2
      - run: ctest --preset=ci-macos
      - run: cmake --build --preset=ci-macos --target run-examples all_verify_interface_header_sets
  sanitize:
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-linux
      - run: cmake --preset=ci-sanitize -DCMAKE_CXX_COMPILER=clang++
      - run: cmake --build --preset=ci-sanitize --parallel 2
      - run: cmake --build --preset=ci-sanitize --target tidy-check
      - run: ctest --preset=ci-sanitize
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
      - run: cmake --preset=fuzz -DCMAKE_CXX_COMPILER=clang++
      - run: cmake --build --preset=fuzz --parallel 2
      - run: cmake --build --preset=fuzz --target tidy-check
      - run: |
          mkdir -p build/fuzz/corpus
          cp test/fuzz/corpus/* build/fuzz/corpus/
          build/fuzz/ini_manager_fuzz -max_total_time=30 -max_len=65536 build/fuzz/corpus
  coverage:
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-linux
      - run: cmake --preset=ci-coverage -DCMAKE_CXX_COMPILER=g++
      - run: cmake --build --preset=ci-coverage --parallel 2
      - run: ctest --preset=ci-coverage
      - run: cmake --build --preset=ci-coverage --target coverage
      - uses: codecov/codecov-action@v5
        with:
          files: build/ci-coverage/coverage.info
          token: ${{ secrets.CODECOV_TOKEN }}
  package:
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-linux
      - run: cmake --workflow --preset=package-release
      - uses: actions/upload-artifact@v4
        with:
          name: ini_manager-1.1.0
          path: |
            build/release/packages/*.tar.gz
            build/release/packages/*.zip
          if-no-files-found: error
  benchmarks:
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    env:
      # CI shells do not source Arch's /etc/profile.d/debuginfod.sh.
      DEBUGINFOD_URLS: https://debuginfod.archlinux.org
    steps:
      # Without Git, checkout downloads an archive and ignores fetch-depth.
      - name: Install Git before checkout
        run: pacman -Syu --noconfirm --needed git
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-linux
      - run: pacman -S --noconfirm --needed valgrind debuginfod
      - name: Prepare and verify Valgrind runtime
        run: |
          debuginfod-find debuginfo /usr/lib/ld-linux-x86-64.so.2
          mkdir -p build/benchmarks
          valgrind --tool=memcheck --error-exitcode=99 --log-file=build/benchmarks/preflight.valgrind.txt /usr/bin/true || {
            cat build/benchmarks/preflight.valgrind.txt
            exit 1
          }
      - name: Measure baseline and current API
        # Container users can differ from the checkout owner. Trust only this
        # workspace, for these Git subprocesses; leave global settings alone.
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: safe.directory
          GIT_CONFIG_VALUE_0: ${{ github.workspace }}
        run: |
          git rev-parse --verify HEAD
          git cat-file -e 824a2acd2886aa9e0ee3d8c390ac5e70b3fa18c6^{commit}
          python3 test/benchmark/compare.py --output build/benchmarks
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-measurements
          path: |
            build/benchmarks/summary.json
            build/benchmarks/*.valgrind.txt
          if-no-files-found: warn
  docs:
    needs: [linux, macos, sanitize]
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-linux
      - run: cmake -DPROJECT_SOURCE_DIR="$PWD" -DPROJECT_BINARY_DIR="$PWD/build" -P cmake/docs-ci.cmake
      - uses: peaceiris/actions-gh-pages@v4
        if: github.ref == 'refs/heads/main' && github.event_name == 'push' && github.repository_owner == 'LineGM'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: build/docs/html
